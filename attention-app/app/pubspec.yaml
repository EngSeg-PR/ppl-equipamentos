name: triagem_atencao_app
description: Avaliações de atenção com histórico local protegido e sincronização PRS. REIS.
publish_to: none
version: 0.3.0+3

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.1.5
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  path: ^1.9.0
  sqflite_sqlcipher: ^3.4.1
  web: ^1.1.0
  triagem_core:
    path: ../packages/core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_prs_reis_3x4.png
    - assets/logo_prs_reis_horizontal.png
